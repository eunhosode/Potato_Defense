 constructor(ch,st){this.ch=+ch;this.sn=+st;this.stage=chapters[ch][st];this.all=[];this.ene=[];this.ab=new Base(ABX,this.stage.ally_base_hp,true);this.eb=new Base(EBX,this.stage.enemy_base_hp,false);this.resource=(ch==2||ch==3||special(ch))?350:200;this.rate=(ch==2||ch==3||special(ch))?32:25;this.level=1;this.upCost=300;this.elapsed=0;this.result=null;this.jobs=[];this.message='';this.msgTime=0;this.reward=0;this.rewardTime=0;this.cd=Object.fromEntries(Object.keys(allies).map(k=>[k,0]));this.ri=0;this.bossSpawned=false;this.bossDeadTime=null;this.nextPost=Infinity;let r=this.stage.reinforcement;this.nextReinf=!r||r.start_after_boss!==undefined?Infinity:+r.start;this.flags=new Set;this.eventReinfs=[];this.defeated=0;this.deadBosses=new Set;for(const [t,groups] of this.stage.waves)this.schedule(groups,t);if(this.stage.initial_event_reinforcement)this.activate(this.stage.initial_event_reinforcement)}

 activate(c){let tag=String(c.tag||`event_${this.eventReinfs.length}`);this.eventReinfs=this.eventReinfs.filter(r=>r.tag!==tag);this.eventReinfs.push({tag,next:this.elapsed+(+c.start_delay||0),interval:+c.interval,patterns:c.patterns,index:0,active:true})}
 trigger(name,c){if(this.flags.has(name))return;this.flags.add(name);let stop=new Set(c.stop_reinforcement_tags||[]);for(const r of this.eventReinfs)if(stop.has(r.tag))r.active=false;if(+c.knockback>0)this.knockAll(+c.knockback);if(c.boss_spawn)this.spawnBoss(c.boss_spawn);if(c.spawn)this.schedule(c.spawn,this.elapsed);for(const [d,g] of(c.delayed_spawns||[]))this.schedule(g,this.elapsed+ +d);if(c.start_reinforcement)this.activate(c.start_reinforcement)}
 updateEventReinfs(){for(const r of this.eventReinfs)if(r.active)while(this.elapsed>=r.next){this.schedule(r.patterns[r.index%r.patterns.length],r.next);r.index++;r.next+=r.interval}}
 stageEvents(){let c=this.stage.base_first_hit_event;if(c&&this.eb.hp<this.eb.maxHp)this.trigger('base_first_hit',c);for(const e of(this.stage.base_hp_ratio_events||[]))if(this.eb.hp<=this.eb.maxHp*e.ratio)this.trigger(String(e.name),e);c=this.stage.clear_field_event;if(c&&this.defeated>=+(c.min_defeats||1)&&!this.ene.some(e=>e.hp>0))this.trigger(String(c.name),c)}
 bossDefeatEvents(){let map=this.stage.boss_defeat_events||{};for(const e of this.ene)if(e.hp<=0&&e.s.is_boss&&!this.deadBosses.has(e.s.key)){this.deadBosses.add(e.s.key);let c=map[e.s.key];if(c)this.trigger(String(c.name||`${e.s.key}_defeated`),c)}}
 maybeBoss(){if(this.stage.boss_spawn_time===undefined||this.bossSpawned)return;let go=this.elapsed>=+this.stage.boss_spawn_time,ratio=+(this.stage.boss_trigger_hp_ratio||0);if(!go&&!(ratio>0&&this.eb.hp<=this.eb.maxHp*ratio))return;let k=this.stage.boss_enemy_key||'boss';this.ene.push(new Fighter(ESX,false,enemies[k]));this.bossSpawned=true;if([9,10].includes(this.sn))this.knockAll(k==='grand_general'?150:110);this.message='General Goguma has entered the battlefield!';this.msgTime=2.5;let r=this.stage.reinforcement;if(r&&r.start_after_boss!==undefined)this.nextReinf=this.elapsed+ +r.start_after_boss}
 reinf(){let r=this.stage.reinforcement;if(!r||(r.requires_boss_spawned&&!this.bossSpawned))return;if(r.stop_when_boss_dead&&this.bossSpawned&&!this.ene.some(e=>e.hp>0&&e.s.is_boss))return;while(this.elapsed>=this.nextReinf){let active=this.ene.filter(e=>e.hp>0&&!(r.exclude_boss_from_cap&&e.s.is_boss)).length;if(active>=+(r.max_active_enemies||9999)){this.nextReinf+=+(r.retry_delay||2);return}this.schedule(r.patterns[this.ri%r.patterns.length],this.nextReinf);this.ri++;this.nextReinf+=+r.interval}}
 bossState(){if(!this.bossSpawned||this.bossDeadTime!==null||this.ene.some(e=>e.hp>0&&e.s.is_boss))return;this.bossDeadTime=this.elapsed;let p=this.stage.post_boss_reinforcement;if(p)this.nextPost=this.elapsed+(+p.start_delay||0);this.msg('General Goguma defeated! Remaining defenders are mobilizing!')}
 post(){let p=this.stage.post_boss_reinforcement;if(!p||this.bossDeadTime===null||this.eb.hp<=0)return;while(this.elapsed>=this.nextPost){this.schedule(p.pattern,this.nextPost);this.nextPost+=+p.interval}}
 shieldBreaks(){for(const e of this.ene)if(e.breakPending){e.breakPending=false;let n=0,d=+(e.s.shield_break_damage||0),r=+(e.s.shield_break_radius||0);if(d&&r){for(const a of this.all)if(a.hp>0&&Math.abs(a.x-e.x)<=r){a.damage(d);n++}if(n)this.msg(`Sugar shield burst! ${n} Potato unit(s) hit.`)}}}
 spawn(k){if(this.result)return;if(!this.stage.available_units.includes(k)){this.msg('Unit not available in this stage.');return}let s=allies[k];if(this.cd[k]>0)return;if(this.resource<s.cost){this.msg('Not enough starch!');return}if(this.all.length>=20){this.msg('Unit limit reached (20).');return}this.resource-=s.cost;this.cd[k]=s.cooldown;this.all.push(new Fighter(ASX-Math.min(18,this.all.length*2),true,s))}
 upgrade(){if(this.result)return;if(this.level>=3){this.msg('Starch production is MAX.');return}if(this.resource<this.upCost){this.msg('Not enough starch for upgrade.');return}this.resource-=this.upCost;this.level++;this.rate=(this.ch==2||this.ch==3||special(this.ch)?{1:32,2:48,3:70}:{1:25,2:40,3:60})[this.level];this.upCost={2:500,3:0}[this.level];this.msg(`Starch production Lv.${this.level}!`)}
 update(dt){if(this.result)return;this.elapsed+=dt;this.resource=Math.min(MAXR,this.resource+this.rate*dt);this.msgTime=Math.max(0,this.msgTime-dt);this.rewardTime=Math.max(0,this.rewardTime-dt);for(const k in this.cd)this.cd[k]=Math.max(0,this.cd[k]-dt);this.maybeBoss();this.reinf();this.updateEventReinfs();for(const j of this.jobs)j.update(this.elapsed,this.ene);for(const a of this.all)a.update(dt,this.ene,this.eb,this.all);this.stageEvents();this.updateEventReinfs();this.maybeBoss();this.shieldBreaks();this.bossState();this.post();for(const j of this.jobs)if(!j.done)j.update(this.elapsed,this.ene);for(const e of this.ene)e.update(dt,this.all,this.ab,this.ene);this.bossDefeatEvents();let dead=this.ene.filter(e=>e.hp<=0);this.defeated+=dead.length;let reward=dead.reduce((n,e)=>n+(+e.s.reward||0),0);if(reward){this.resource=Math.min(MAXR,this.resource+reward);this.reward=reward;this.rewardTime=1}this.stageEvents();this.updateEventReinfs();for(const j of this.jobs)if(!j.done)j.update(this.elapsed,this.ene);this.all=this.all.filter(u=>u.hp>0&&u.x<W+100);this.ene=this.ene.filter(u=>u.hp>0&&u.x>-100);if(this.ab.hp<=0)this.result='DEFEAT';else if(this.eb.hp<=0){if(this.stage.victory_requires_no_boss){let req=this.stage.victory_requires_event;if((!req||this.flags.has(req))&&!this.ene.some(e=>e.hp>0&&e.s.is_boss))this.result='VICTORY'}else if(this.stage.requires_boss_defeat){if(this.bossSpawned&&this.bossDeadTime!==null)this.result='VICTORY'}else this.result='VICTORY'}}
 draw(){battle();this.ab.draw();this.eb.draw();[...this.all,...this.ene].sort((a,b)=>a.x-b.x).forEach(f=>f.draw());this.hud();if(this.result){ctx.fillStyle='#00000091';ctx.fillRect(0,0,W,H);txt(this.result,W/2,H/2-45,64,this.result==='VICTORY'?C.GREEN:C.RED,'center',true);txt('Press ENTER: replay   |   ESC: stage select',W/2,H/2+35,24,C.WHITE,'center')}drawBackButton(this.result?'Stage Select':'Retreat')}
 hud(){let hh=this.ch==3||special(this.ch)?260:this.ch==2?205:150;ctx.fillStyle=C.HUD;ctx.fillRect(0,0,W,hh);ctx.fillStyle=C.GD;ctx.fillRect(0,hh,W,3);txt(this.stage.name,28,34,38,C.TEXT,'left',true);txt(this.stage.subtitle,30,63,18,'#464646');rr(860,18,390,58,10,'#fffad2',C.GD,2);txt(`Starch: ${Math.floor(this.resource)} / ${MAXR}    +${Math.floor(this.rate)}/s`,880,47,24);if(this.rewardTime>0)txt(`+${this.reward}`,1165,86,24,C.GREEN);
  const keys=unitKeys(this.ch);for(let i=0;i<keys.length;i++){let k=keys[i],s=allies[k],x=28+(i%4)*190,y=88+Math.floor(i/4)*55,avail=this.stage.available_units.includes(k);rr(x,y,175,50,8,avail?`rgb(${s.color.join(',')})`:C.LG,C.BLACK,2);txt(`[${i===9?0:i+1}] ${s.name} ${s.cost}`,x+7,y+16,18,avail?C.BLACK:C.GRAY);if(!avail)txt('LOCKED',x+52,y+38,18,C.GRAY);else if(this.cd[k]>0){ctx.fillStyle='#00000069';ctx.fillRect(x,y,175*this.cd[k]/s.cooldown,50);txt(`${this.cd[k].toFixed(1)}s`,x+87,y+38,18,C.WHITE,'center')}else if(this.resource<s.cost){ctx.fillStyle='#00000046';ctx.fillRect(x,y,175,50)}}rr(790,91,240,44,8,C.YELLOW,C.BLACK,2);txt(this.level>=3?'[A] Starch Lv.3 MAX':`[A] Upgrade Lv.${this.level+1} (${this.upCost})`,805,113,18);txt(`Time ${this.elapsed.toFixed(1).padStart(5,'0')}s   Allies ${this.all.length}/20   Enemies ${this.ene.length}   Waves left ${this.jobs.filter(j=>!j.done).length}`,1048,113,18);if(this.msgTime>0)txt(this.message,W/2,this.ch==3||special(this.ch)?280:this.ch==2?225:176,24,C.RED,'center')}
}
function battle(){ctx.fillStyle=C.BG;ctx.fillRect(0,0,W,H);ctx.fillStyle='#b7db9c';ctx.fillRect(0,150,W,GY-150);ctx.fillStyle=C.GROUND;ctx.fillRect(0,GY,W,H-GY);ctx.fillStyle=C.GD;ctx.fillRect(0,GY,W,5);ctx.strokeStyle='#a57d4b';ctx.lineWidth=2;for(let x=160;x<W-100;x+=90){ctx.beginPath();ctx.moveTo(x,GY+35);ctx.lineTo(x+50,H);ctx.stroke()}}
function modeMenu(){ctx.fillStyle='#f0ebd2';ctx.fillRect(0,0,W,H);txt('POTATO KINGDOM DEFENSE',W/2,105,64,'#91562b','center',true);txt('Choose game mode',W/2,165,24,C.TEXT,'center');buttons=[];[['main','MAIN STAGES','Chapters 1, 2, and 3','#ab7e48'],['special','SPECIAL STAGES','Three themed challenge chapters',C.PURPLE]].forEach((d,i)=>{let r={x:250,y:220+i*180,w:780,h:135,v:d[0]};rr(r.x,r.y,r.w,r.h,20,C.WHITE,d[3],6);txt(d[1],295,r.y+43,38,d[3],'left',true);txt(d[2],300,r.y+91,24);buttons.push(r)});txt('Click a mode or press 1 / 2',W/2,675,18,C.TEXT,'center')}
function chapterMenu(sp=false){ctx.fillStyle='#f0ebd2';ctx.fillRect(0,0,W,H);txt('POTATO KINGDOM DEFENSE',W/2,90,64,sp?C.PURPLE:'#91562b','center',true);txt(sp?'SPECIAL STAGES - Choose a challenge chapter':'MAIN STAGES - Choose a chapter',W/2,145,24,C.TEXT,'center');buttons=[];let d=sp?[[101,'ANGRY CROWD','3-stage themed challenge',C.RED],[102,'AUTOBAHN','3-stage themed challenge',C.ORANGE],[103,'NOMAD ARCHERS','3-stage themed challenge',C.PURPLE]]:[[1,'CHAPTER 1','The First Sweet Potato Invasion','#ab7e48'],[2,'CHAPTER 2','The Imperial Counterattack',C.PURPLE],[3,'CHAPTER 3','Potato Kingdom Counteroffensive',C.ORANGE]];d.forEach((a,i)=>{let r={x:250,y:175+i*155,w:780,h:118,v:a[0]};rr(r.x,r.y,r.w,r.h,18,C.WHITE,a[3],5);txt(a[1],285,r.y+37,38,a[3],'left',true);txt(a[2],290,r.y+82,24);buttons.push(r)});txt(`Click a chapter or press 1 / 2 / 3. ESC returns to mode select.`,W/2,675,18,C.TEXT,'center');drawBackButton()}
function stageMenu(){ctx.fillStyle='#f0ebd2';ctx.fillRect(0,0,W,H);let sp=special(selected),col=sp?([C.RED,C.ORANGE,C.PURPLE][selected-101]):selected==1?'#91562b':selected==2?C.PURPLE:C.ORANGE;txt('POTATO KINGDOM DEFENSE',W/2,72,64,col,'center',true);txt(sp?`SPECIAL: ${['ANGRY CROWD','AUTOBAHN','NOMAD ARCHERS'][selected-101]}`:`Chapter ${selected}: stages ${selected}-1 to ${selected}-10`,W/2,120,24,C.TEXT,'center');rr(150,155,980,500,14,'#e8e2c6',C.GD,2);buttons=[];ctx.save();ctx.beginPath();ctx.rect(150,155,980,500);ctx.clip();let stages=chapters[selected],count=sp?3:10;for(let n=1;n<=count;n++){let y=170-scroll,r={x:185,y:y+(n-1)*82,w:910,h:68,v:n},st=stages&&stages[n];if(!st||r.y+r.h<155||r.y>655)continue;rr(r.x,r.y,r.w,r.h,11,C.WHITE,col,3);txt(st.name,210,r.y+22,24);txt(st.subtitle,212,r.y+49,18,'#4b4b4b');txt(String(n),1055,r.y+34,38,col,'center',true);buttons.push(r)}ctx.restore();if(count*82>500){let max=count*82-500,th=Math.max(60,470*500/(count*82)),ty=170+(470-th)*scroll/max;rr(1110,170,8,470,4,C.LG);rr(1110,ty,8,th,4,col)}txt(`Click a stage or press its number. ESC returns to ${sp?'special chapter select':'main chapter select'}.`,W/2,687,18,C.TEXT,'center');drawBackButton()}
function draw(){if(mode==='mode')modeMenu();else if(mode==='chapters')chapterMenu(false);else if(mode==='special')chapterMenu(true);else if(mode==='stages')stageMenu();else session.draw()}
function start(n){session=new Game(selected,n);mode='game'}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='escape'&&mode!=='mode')goBack();else if(mode==='mode'){if(k==='1')mode='chapters';if(k==='2')mode='special'}else if(mode==='chapters'||mode==='special'){if(['1','2','3'].includes(k)){selected=mode==='special'?100+ +k:+k;scroll=0;mode='stages'}}else if(mode==='stages'){let count=special(selected)?3:10,max=Math.max(0,count*82-500);if(/^\d$/.test(k)){let n=k==='0'?10:+k;if(n>=1&&n<=count)start(n)}else if(k==='arrowdown')scroll=Math.min(max,scroll+64);else if(k==='arrowup')scroll=Math.max(0,scroll-64);else if(k==='pagedown')scroll=Math.min(max,scroll+320);else if(k==='pageup')scroll=Math.max(0,scroll-320)}else{if(k==='r'||(k==='enter'&&session.result))session=new Game(session.ch,session.sn);else if('1234567890'.includes(k))session.spawn(unitKeys(session.ch)[k==='0'?9:+k-1]);else if(k==='a')session.upgrade()}if(['arrowdown','arrowup',' '].includes(k))e.preventDefault()});
cv.addEventListener('wheel',e=>{if(mode==='stages'){let count=special(selected)?3:10;scroll=clamp(scroll+Math.sign(e.deltaY)*72,0,Math.max(0,count*82-500));e.preventDefault()}},{passive:false});
cv.addEventListener('pointerdown',e=>{let q=cv.getBoundingClientRect(),x=(e.clientX-q.left)*W/q.width,y=(e.clientY-q.top)*H/q.height;if(mode!=='mode'&&hit(BACK_BUTTON,x,y)){goBack();return}if(mode==='mode'){let b=buttons.find(r=>hit(r,x,y));if(b)mode=b.v==='main'?'chapters':'special'}else if(mode==='chapters'||mode==='special'){let b=buttons.find(r=>hit(r,x,y));if(b){selected=b.v;scroll=0;mode='stages'}}else if(mode==='stages'){let b=buttons.find(r=>hit(r,x,y));if(b)start(b.v)}else if(session&&!session.result){let keys=unitKeys(session.ch);for(let i=0;i<keys.length;i++){let r={x:28+(i%4)*190,y:88+Math.floor(i/4)*55,w:175,h:50};if(hit(r,x,y))session.spawn(keys[i])}if(hit({x:790,y:91,w:240,h:44},x,y))session.upgrade()}});
